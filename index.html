<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08090d" />
  <title>Formless</title>
  <meta name="description" content="A clicker that becomes what you teach it to be." />
  <link rel="stylesheet" href="styles.css?v=0.5.0" />
</head>
<body data-form="formless">
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="grain"></div>

  <main class="game-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">FORMLESS</p>
        <h1 id="formName">The Formless</h1>
      </div>
      <div class="top-actions">
        <button id="soundButton" class="text-button" type="button" aria-pressed="false">Sound off</button>
        <button id="resetButton" class="text-button" type="button">Release form</button>
      </div>
    </header>

    <section class="game-stage" aria-label="Main game area">
      <div class="resource-block">
        <span id="energy" class="resource-value">0</span>
        <span class="resource-label">energy</span>
        <p id="rateText" class="rate-text">+1 per touch</p>
        <p id="mechanicText" class="mechanic-text" aria-live="polite"></p>
      </div>

      <div class="entity-wrap">
        <div id="entityAura" class="entity-aura"></div>
        <button id="entity" class="entity" type="button" aria-label="Touch the form">
          <span class="entity-field field-heat"></span>
          <span class="entity-field field-reserve"></span>
          <span class="entity-field field-pulse"></span>
          <span class="entity-shell"></span>
          <span class="entity-core"></span>
          <span class="entity-markings"></span>

          <span class="entity-fragments fragments-a">
            <i></i><i></i><i></i><i></i>
          </span>
          <span class="entity-fragments fragments-b">
            <i></i><i></i><i></i>
          </span>

          <span class="entity-ring ring-one"></span>
          <span class="entity-ring ring-two"></span>
          <span class="entity-ring ring-three"></span>

          <span class="entity-node node-one"></span>
          <span class="entity-node node-two"></span>
          <span class="entity-node node-three"></span>
        </button>
        <div id="floatLayer" class="float-layer" aria-hidden="true"></div>
      </div>

      <div class="whisper-wrap">
        <p id="whisper" class="whisper">It does not know what it is yet.</p>
        <p id="evolutionStatus" class="evolution-status">Evolution: ???</p>
      </div>
    </section>


  </main>

  <button id="shapingButton" class="drawer-toggle drawer-toggle-left" type="button"
    aria-label="Open shaping" aria-controls="shapingDrawer" aria-expanded="false">
    <span></span><span></span><span></span>
    <small>Shape</small>
  </button>

  <button id="codexButton" class="drawer-toggle drawer-toggle-right" type="button"
    aria-label="Open Discovery Codex" aria-controls="codexDrawer" aria-expanded="false">
    <span></span><span></span><span></span>
    <small>Codex</small>
  </button>

  <button id="drawerBackdrop" class="drawer-backdrop" type="button" aria-label="Close menu" hidden></button>

  <aside id="shapingDrawer" class="drawer drawer-left" aria-label="Shaping" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <p class="eyebrow">SHAPING</p>
        <h2>What will you teach it?</h2>
      </div>
      <button id="shapingClose" class="drawer-close" type="button" aria-label="Close shaping">×</button>
    </div>
    <div class="drawer-scroll">
      <div id="upgrades" class="upgrade-list"></div>
    </div>
  </aside>

  <aside id="codexDrawer" class="drawer drawer-right" aria-label="Discovery Codex" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <p class="eyebrow">DISCOVERY CODEX</p>
        <h2>What have you become?</h2>
      </div>
      <button id="codexClose" class="drawer-close" type="button" aria-label="Close Codex">×</button>
    </div>
    <div class="drawer-subhead">
      <span id="discoveryCount" class="discovery-count">0 discovered</span>
    </div>
    <div class="drawer-scroll">
      <div id="codexList" class="codex-list"></div>
    </div>
  </aside>

  <div id="evolutionOverlay" class="evolution-overlay" hidden>
    <div class="evolution-card">
      <p class="eyebrow">SOMETHING HAS CHANGED</p>
      <div id="evolutionGlyph" class="evolution-glyph">✦</div>
      <h2 id="evolutionTitle">It remembers.</h2>
      <p id="evolutionCopy"></p>
      <button id="continueButton" class="primary-button" type="button">Continue</button>
    </div>
  </div>

  <script src="game.js?v=0.5.0"></script>
</body>
</html>
